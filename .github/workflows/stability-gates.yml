name: stability-gates

on:
  pull_request:
  push:

jobs:
  quality-and-concurrency:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt pytest mcp
      - name: Run regression tests
        run: python -m pytest -q
      - name: Run quality and 20/50 concurrency gates
        run: python -m eval.run_stability_gates
      - name: Upload gate reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stability-gate-reports
          path: eval/golden/*_report.json
          if-no-files-found: ignore
